[project]
name = "sentinelscan"
version = "1.0.0"
description = "Automated web vulnerability scanner covering common OWASP Top 10 misconfigurations."
authors = [{ name = "Mohak Chaudhary (GhostHowl)" }]
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31.0",
    "colorama>=0.4.6",
]

[project.scripts]
sentinelscan = "sentinelscan.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentinelscan*"]
